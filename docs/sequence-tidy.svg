<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" width="1400" height="1180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <symbol id="i-user" viewBox="0 0 48 48"><circle cx="24" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 42c2-9 8-14 16-14s14 5 16 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-brain" viewBox="0 0 48 48"><path d="M24 8v32M24 10a7 7 0 0 0-13 3 7 7 0 0 0-3 12 7 7 0 0 0 5 11 7 7 0 0 0 11 3M24 10a7 7 0 0 1 13 3 7 7 0 0 1 3 12 7 7 0 0 1-5 11 7 7 0 0 1-11 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-pack" viewBox="0 0 48 48"><path d="M24 5l17 9v20l-17 9-17-9V14zM7 14l17 9 17-9M24 23v20" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><rect x="7" y="7" width="34" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="7" y="27" width="34" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="14" cy="14" r="2" fill="currentColor"/><circle cx="14" cy="34" r="2" fill="currentColor"/><path d="M22 14h12M22 34h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-cam" viewBox="0 0 48 48"><path d="M6 15h9l4-6h10l4 6h9v24H6z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="26" r="8" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-arm" viewBox="0 0 48 48"><path d="M8 44h20M18 44V36" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="32" r="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 29l10-15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="31" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M34 13l7 6M41 19l-2 6M41 19l4 3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="1400" height="1180" fill="#f8fafc"/>
  <text x="48" y="56" font-size="30" font-weight="800" fill="#0f172a">Tidy mode: "pens left, snacks right", then a hand-over</text>
  <text x="48" y="86" font-size="16" fill="#475569">Claude Code with the table pack. Claude only picks ids and bins; the arm server plans, moves and reports events. The voice agent makes the same HTTP calls without arm_mcp.</text>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"><path d="M130 190V1130M350 190V1130M570 190V1130M800 190V1130M1040 190V1130M1270 190V1130"/></g>

  <!-- participant heads -->
  <g font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
    <g filter="url(#sh)"><rect x="50" y="110" width="160" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="270" y="110" width="160" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="490" y="110" width="160" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="710" y="110" width="180" height="80" rx="14" fill="#fff" stroke="#94a3b8"/><rect x="960" y="110" width="160" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="1190" y="110" width="160" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
    <use href="#i-user" x="112" y="118" width="36" height="36" color="#0369a1"/><text x="130" y="178">Person</text>
    <use href="#i-brain" x="332" y="118" width="36" height="36" color="#b45309"/><text x="350" y="178">Claude</text>
    <use href="#i-pack" x="552" y="118" width="36" height="36" color="#15803d"/><text x="570" y="178">arm_mcp (table)</text>
    <use href="#i-server" x="782" y="118" width="36" height="36" color="#334155"/><text x="800" y="178">arm_server</text>
    <use href="#i-cam" x="1022" y="118" width="36" height="36" color="#0e7490"/><text x="1040" y="178">live_vision</text>
    <use href="#i-arm" x="1252" y="118" width="36" height="36" color="#be185d"/><text x="1270" y="178">Arm</text>
  </g>

  <!-- activation bars -->
  <g fill="#fff7ed" stroke="#fdba74"><rect x="793" y="430" width="14" height="300"/></g>

  <g font-size="14" fill="#0f172a">
    <!-- 1 -->
    <circle cx="44" cy="232" r="13" fill="#0f172a"/><text x="44" y="237" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <path d="M130 238H346" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="142" y="228" font-style="italic">"Alfred, tidy my desk: pens left, snacks right"</text>
    <!-- 2 -->
    <circle cx="44" cy="282" r="13" fill="#0f172a"/><text x="44" y="287" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <path d="M350 282H566" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="372" y="273" font-family="ui-monospace,Menlo,monospace">objects()</text>
    <path d="M570 296H796" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="584" y="290" font-family="ui-monospace,Menlo,monospace" font-size="13">GET /api/objects</text>
    <path d="M800 310H1036" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="814" y="304" font-size="13">latest world.json (5 Hz)</text>
    <path d="M1040 336H804" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="852" y="352" fill="#475569" font-size="13">id · label · x,y · pickable</text>
    <path d="M800 362H354" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="380" y="380" fill="#475569" font-size="13">#1 pen · #2 pencil · #3 candy · #4 gummy</text>
    <!-- decide -->
    <rect x="300" y="392" width="230" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d"/><text x="314" y="412" font-size="13" fill="#92400e">decides: 1,2 → bin1 · 3,4 → bin2</text>
    <!-- 3 -->
    <circle cx="44" cy="452" r="13" fill="#0f172a"/><text x="44" y="457" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <path d="M350 446H566" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="372" y="438" font-family="ui-monospace,Menlo,monospace">pick([1,2], bin1)</text>
    <path d="M570 460H791" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="584" y="454" font-family="ui-monospace,Menlo,monospace" font-size="13">POST /api/pick</text>
    <path d="M793 480H354" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="500" y="496" fill="#475569" font-size="13">"started" (returns at once)</text>

    <!-- loop frame -->
    <rect x="770" y="510" width="560" height="190" rx="10" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="M770 510h120v22l-10 10H770z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="780" y="532" font-size="13" font-weight="700">loop each id</text>
    <text x="900" y="532" font-size="12" fill="#475569">background thread, voice keeps listening</text>
    <rect x="818" y="550" width="300" height="30" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="830" y="570" font-size="13" fill="#9a3412">IK check · width limit · workspace clamp</text>
    <path d="M807 602H1266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="900" y="596" font-size="13">hover → descend → grip → lift → drop in bin</text>
    <path d="M1270 630H811" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="900" y="648" fill="#475569" font-size="13">pose reached / gripper closed</text>
    <rect x="818" y="660" width="260" height="28" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="830" y="679" font-size="13" fill="#334155">event: "pen → bin1"</text>

    <!-- 4 wait -->
    <circle cx="44" cy="732" r="13" fill="#0f172a"/><text x="44" y="737" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <path d="M350 722H566" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="372" y="714" font-family="ui-monospace,Menlo,monospace">wait()</text>
    <path d="M570 736H791" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="584" y="730" font-family="ui-monospace,Menlo,monospace" font-size="13">GET /api/events?after=N</text>
    <path d="M793 756H354" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/><text x="400" y="772" fill="#475569" font-size="13">idle · events: pen → bin1, pencil → bin1</text>
    <path d="M350 800H134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="150" y="792" font-style="italic">"Pens are on the left."</text>
    <text x="150" y="822" font-size="12" fill="#64748b">same for snacks → bin2</text>

    <!-- 5 handover -->
    <circle cx="44" cy="868" r="13" fill="#0f172a"/><text x="44" y="873" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <path d="M130 868H346" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="142" y="858" font-style="italic">"Alfred, hand me the pen"</text>
    <path d="M350 890H566" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="372" y="882" font-family="ui-monospace,Menlo,monospace">handover(1)</text>
    <path d="M570 904H796" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="584" y="898" font-family="ui-monospace,Menlo,monospace" font-size="13">POST /api/handover</text>
    <path d="M800 924H1266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="814" y="918" font-size="13">pick, then move slowly to the taught hand-over pose, hold</text>
    <path d="M350 952H134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="150" y="944" font-style="italic">"Here you go."</text><text x="380" y="944" font-size="12" fill="#64748b">after wait() reports it is held out</text>
    <!-- 6 release -->
    <circle cx="44" cy="992" r="13" fill="#0f172a"/><text x="44" y="997" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">6</text>
    <path d="M130 992H346" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="142" y="982" font-style="italic">"Got it, thanks"</text>
    <path d="M350 1012H566" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="372" y="1004" font-family="ui-monospace,Menlo,monospace">release()</text>
    <path d="M570 1026H796" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="584" y="1020" font-family="ui-monospace,Menlo,monospace" font-size="13">POST /api/release</text>
    <path d="M800 1048H1266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="814" y="1042" font-size="13">open jaws → home</text>
    <text x="814" y="1068" font-size="12" fill="#64748b">no "got it" within 45 s → puts the pen back, goes home</text>
  </g>

  <!-- stop note -->
  <rect x="48" y="1090" width="1304" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="80" cy="1120" r="14" fill="#dc2626"/><path d="M73 1120h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="106" y="1115" font-size="15" font-weight="700" fill="#991b1b">At any step: saying "stop" on the voice page calls /api/stop directly, without the model.</text>
  <text x="106" y="1137" font-size="13" fill="#b91c1c">The arm pauses where it is. "Resume" continues; "abort" puts a held object back. The 12 V plug is the hard stop.</text>
</svg>
