    <symbol id="i-pack" viewBox="0 0 48 48"><path d="M24 5l17 9v20l-17 9-17-9V14zM7 14l17 9 17-9M24 23v20" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><rect x="7" y="7" width="34" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="7" y="27" width="34" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="14" cy="14" r="2" fill="currentColor"/><circle cx="14" cy="34" r="2" fill="currentColor"/><path d="M22 14h12M22 34h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
