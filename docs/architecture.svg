  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#0f172a">Alfred architecture</text>
  <text x="48" y="88" font-size="16" fill="#475569">Two front doors, one arm server. The agent picks objects and bins; the arm server moves and keeps the arm safe.</text>

  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">
    <text x="62" y="140">YOU</text><text x="352" y="140">AGENT</text><text x="722" y="140">ARM SERVER (127.0.0.1)</text><text x="1112" y="140">HARDWARE</text>
  </g>

  <!-- Person -->
  <g filter="url(#sh)"><rect x="48" y="300" width="220" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="64" y="322" width="56" height="56" rx="12" fill="#e0f2fe"/><use href="#i-user" x="70" y="328" width="44" height="44" color="#0369a1"/>
  <text x="134" y="345" font-size="18" font-weight="700" fill="#0f172a">Person</text>
  <text x="134" y="368" font-size="13" fill="#475569">speaks or types</text>

  <!-- Voice agent -->
  <g filter="url(#sh)"><rect x="338" y="170" width="290" height="130" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="354" y="190" width="56" height="56" rx="12" fill="#ede9fe"/><use href="#i-mic" x="360" y="196" width="44" height="44" color="#6d28d9"/>
  <text x="424" y="212" font-size="18" font-weight="700" fill="#0f172a">Voice agent</text>
  <text x="424" y="234" font-size="13" fill="#475569">ElevenLabs + Claude Haiku</text>
  <text x="354" y="276" font-size="12" fill="#6d28d9" font-family="ui-monospace,Menlo,monospace">voice_page.html (served on :8772)</text>

  <!-- Claude Code + pack -->
  <g filter="url(#sh)"><rect x="338" y="400" width="290" height="190" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="354" y="420" width="56" height="56" rx="12" fill="#dcfce7"/><use href="#i-pack" x="360" y="426" width="44" height="44" color="#15803d"/>
  <text x="424" y="442" font-size="18" font-weight="700" fill="#0f172a">Claude Code</text>
  <text x="424" y="464" font-size="13" fill="#475569">+ arm_mcp.py (MCP pack)</text>
  <g font-size="13" fill="#166534">
    <rect x="354" y="494" width="258" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="368" y="517"><tspan font-weight="700">table</tspan>  pick · set_bin · handover · 100%</text>
    <rect x="354" y="538" width="258" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="368" y="561"><tspan font-weight="700">assist</tspan>  feed · handover · 30%</text>
  </g>

  <!-- arm_server -->
  <g filter="url(#sh)"><rect x="708" y="230" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/></g>
  <rect x="724" y="250" width="56" height="56" rx="12" fill="#e2e8f0"/><use href="#i-server" x="730" y="256" width="44" height="44" color="#334155"/>
  <text x="794" y="272" font-size="18" font-weight="700" fill="#0f172a">arm_server.py</text>
  <text x="794" y="294" font-size="13" fill="#475569">owns the arm · HTTP :8772</text>
  <text x="724" y="336" font-size="13" fill="#334155">pick · handover · feed · stop · speed</text>
  <rect x="724" y="354" width="288" height="106" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <use href="#i-shield" x="736" y="368" width="36" height="36" color="#c2410c"/>
  <text x="782" y="386" font-size="14" font-weight="700" fill="#9a3412">Safety lives here</text>
  <text x="782" y="408" font-size="12" fill="#9a3412">workspace and IK limits</text>
  <text x="782" y="426" font-size="12" fill="#9a3412">speed cap, slow near the person</text>
  <text x="782" y="444" font-size="12" fill="#9a3412">stop · abort puts the object back</text>

  <!-- live vision -->
  <g filter="url(#sh)"><rect x="708" y="540" width="320" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="724" y="562" width="56" height="56" rx="12" fill="#cffafe"/><use href="#i-cam" x="730" y="568" width="44" height="44" color="#0e7490"/>
  <text x="794" y="585" font-size="18" font-weight="700" fill="#0f172a">live_vision.py</text>
  <text x="794" y="608" font-size="13" fill="#475569">OpenCV · objects + table x,y</text>

  <!-- Station -->
  <g filter="url(#sh)"><rect x="1098" y="230" width="250" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="1114" y="252" width="56" height="56" rx="12" fill="#e0e7ff"/><use href="#i-cog" x="1120" y="258" width="44" height="44" color="#4338ca"/>
  <text x="1184" y="275" font-size="18" font-weight="700" fill="#0f172a">Station + IK</text>
  <text x="1184" y="298" font-size="13" fill="#475569">NormaCore API</text>

  <!-- Arm -->
  <g filter="url(#sh)"><rect x="1098" y="380" width="250" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="1114" y="402" width="56" height="56" rx="12" fill="#fce7f3"/><use href="#i-arm" x="1120" y="408" width="44" height="44" color="#be185d"/>
  <text x="1184" y="425" font-size="18" font-weight="700" fill="#0f172a">ElRobot arm</text>
  <text x="1184" y="448" font-size="13" fill="#475569">12 V plug = hard stop</text>

  <!-- Camera -->
  <g filter="url(#sh)"><rect x="1098" y="540" width="250" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/></g>
  <rect x="1114" y="562" width="56" height="56" rx="12" fill="#cffafe"/><use href="#i-cam" x="1120" y="568" width="44" height="44" color="#0e7490"/>
  <text x="1184" y="585" font-size="18" font-weight="700" fill="#0f172a">USB camera</text>
  <text x="1184" y="608" font-size="13" fill="#475569">top view of the table</text>

