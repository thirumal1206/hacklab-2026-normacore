    <text x="276" y="268">voice</text>
    <text x="276" y="440">text</text>
    <text x="640" y="222">HTTP</text>
    <text x="640" y="492">HTTP</text>
    <text x="1036" y="270">pose → joints</text>
    <text x="1040" y="580">frames</text>
