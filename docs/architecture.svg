    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <!-- icons: 48x48, stroke style -->
    <symbol id="i-user" viewBox="0 0 48 48"><circle cx="24" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 42c2-9 8-14 16-14s14 5 16 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 48 48"><rect x="17" y="5" width="14" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M10 23a14 14 0 0 0 28 0M24 37v6M17 43h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-brain" viewBox="0 0 48 48"><path d="M24 8v32M24 10a7 7 0 0 0-13 3 7 7 0 0 0-3 12 7 7 0 0 0 5 11 7 7 0 0 0 11 3M24 10a7 7 0 0 1 13 3 7 7 0 0 1 3 12 7 7 0 0 1-5 11 7 7 0 0 1-11 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
